<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="m-top">
      <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기" aria-expanded="false">☰</button>
      <a class="brand" href="#home"><span class="brand-logo">🎙️</span><span><b>스피킹 러너</b></span></a>
    </header>
    <div class="scrim" id="scrim"></div>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#home">
        <span class="brand-logo">🎙️</span>
        <span><b>스피킹 러너</b><small>TOEIC Speaking 연습</small></span>
      </a>
      <nav class="nav">
        <a href="#home" data-nav="home"><span>🏠</span>홈</a>

        <a href="#bookmarks" data-nav="bookmarks"><span>⭐</span>북마크 <em id="bmCount" class="nav-badge"></em></a>
      </nav>
      <button class="nav-settings" id="openSettings"><span>⚙️</span>설정 · 백업</button>
    </aside>
    <main class="main" id="view"></main>
  </div>

  <!-- 실전 모드 CBT 화면 -->
  <div id="cbt" class="cbt hidden" aria-live="polite"></div>

  <!-- 모달 -->
  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
  <div id="toast" class="toast"></div>

  <script src="js/data-bank.js"></script>
  <script src="js/data-p1.js"></script>
  <script src="js/data-p2.js"></script>
  <script src="js/data-p3.js"></script>

  <script src="js/data-p5.js"></script>
